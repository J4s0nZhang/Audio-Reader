<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Reader">
  <meta name="theme-color" content="#f5f3ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151413" media="(prefers-color-scheme: dark)">
  <title>Kokoro Reader</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <style>
    :root {
      --bg: #f5f3ef; --card: #ffffff; --ink: #1d1b19; --muted: #6f6a64; --line: #e4e0da;
      --accent: #c2410c; --accent-ink: #ffffff; --accent-soft: #fbe7dc; --danger: #b42318;
      --ok: #2f7d4f; --radius: 16px; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.04);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #151413; --card: #211f1d; --ink: #f2efeb; --muted: #a39d96; --line: #34312e;
        --accent: #f0743a; --accent-ink: #1a0d05; --accent-soft: #3a2418; --danger: #f97066; --ok: #6cc08b;
        --shadow: none;
      }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); }
    body {
      font: 17px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      min-height: 100vh; -webkit-text-size-adjust: 100%;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px 40px; }

    header.bar {
      position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: saturate(180%) blur(16px); -webkit-backdrop-filter: saturate(180%) blur(16px);
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 52px; padding: 0 8px;
    }
    header.bar h1 { margin: 0; font-size: 17px; font-weight: 600; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60vw; }
    header.bar .left { justify-self: start; } header.bar .right { justify-self: end; }
    .navbtn { background: none; border: 0; color: var(--accent); padding: 10px 8px; font-size: 17px; display: inline-flex; align-items: center; gap: 4px; }
    .navbtn svg { width: 22px; height: 22px; }

    .big-title { font-size: 32px; font-weight: 700; letter-spacing: -.02em; margin: 8px 0 14px; }
    .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--line); padding: 16px; margin: 0 0 14px; }
    .muted { color: var(--muted); } .small { font-size: 14px; } .tiny { font-size: 12.5px; }
    .row { display: flex; gap: 10px; align-items: center; }
    .row.wrapok { flex-wrap: wrap; }
    .spacer { flex: 1; }
    .stack > * + * { margin-top: 12px; }

    .btn {
      appearance: none; border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 600; font-size: 16px;
      background: var(--accent-soft); color: var(--accent); display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px;
    }
    .btn.primary { background: var(--accent); color: var(--accent-ink); }
    .btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); }
    .btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--line); }
    .btn.block { width: 100%; }
    .btn:disabled { opacity: .45; }
    .btn svg { width: 20px; height: 20px; }

    .doclist { list-style: none; margin: 0; padding: 0; }
    .doclist li { border-bottom: 1px solid var(--line); }
    .doclist li:last-child { border-bottom: 0; }
    .doclist button { width: 100%; text-align: left; background: none; border: 0; padding: 14px 4px; display: flex; gap: 12px; align-items: center; }
    .doclist .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .doclist .m { font-size: 14px; color: var(--muted); }
    .doclist .grow { flex: 1; min-width: 0; }
    .pill { font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 99px; background: var(--line); color: var(--muted); white-space: nowrap; }
    .pill.ready { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
    .pill.busy { background: var(--accent-soft); color: var(--accent); }
    .chev { color: var(--muted); width: 18px; height: 18px; flex: none; }

    .empty { text-align: center; padding: 40px 16px; }
    .empty svg { width: 56px; height: 56px; color: var(--accent); }

    label.field { display: block; font-size: 14px; color: var(--muted); margin-bottom: 6px; }
    input[type=text], select, textarea {
      width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 12px; font-size: 16px; outline: none;
    }
    select { appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 20px) 52%, calc(100% - 14px) 52%; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 36px; }
    textarea { min-height: 45vh; resize: vertical; line-height: 1.5; }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    .check { display: flex; gap: 10px; align-items: center; font-size: 15px; }
    .check input { width: 20px; height: 20px; accent-color: var(--accent); }

    .progress { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
    .progress > div { height: 100%; background: var(--accent); width: 0; transition: width .3s; }

    .player .time { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--muted); display: flex; justify-content: space-between; margin-top: 4px; }
    .player input[type=range] { width: 100%; accent-color: var(--accent); height: 28px; }
    .controls { display: flex; justify-content: center; align-items: center; gap: 22px; margin-top: 6px; }
    .roundbtn { background: none; border: 0; color: var(--ink); display: grid; place-items: center; width: 52px; height: 52px; border-radius: 50%; position: relative; }
    .roundbtn svg { width: 30px; height: 30px; }
    .roundbtn .lbl { position: absolute; font-size: 10px; font-weight: 700; top: 19px; }
    .playbtn { width: 72px; height: 72px; background: var(--accent); color: var(--accent-ink); border-radius: 50%; }
    .playbtn svg { width: 34px; height: 34px; }
    .rate { background: var(--accent-soft); color: var(--accent); border: 0; border-radius: 10px; padding: 6px 10px; font-weight: 700; font-size: 14px; min-width: 56px; }

    .textpreview { white-space: pre-wrap; max-height: 40vh; overflow: auto; font-size: 15px; color: var(--muted); }
    details summary { cursor: pointer; font-weight: 600; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    .seg { display: grid; gap: 8px; }
    .seg label { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border: 1px solid var(--line); border-radius: 12px; }
    .seg input { margin-top: 3px; width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
    .toast {
      position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px);
      background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 14px; font-size: 15px; max-width: min(92vw, 520px);
      opacity: 0; pointer-events: none; transition: all .25s; z-index: 50; text-align: center;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .hidden { display: none !important; }
    .warn { background: var(--accent-soft); color: var(--ink); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <audio id="player" preload="auto" playsinline></audio>
  <audio id="previewPlayer" preload="auto" playsinline></audio>
  <noscript><p style="padding:20px">This app needs JavaScript.</p></noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
